name: Render Quarto Master

on:
  push:
    paths:
      - '**.qmd'
      - '.github/workflows/**'
      - '1_experiment/**'
  pull_request:
    paths:
      - '**.qmd'
      - '1_experiment/**'

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup-quarto@v2
        with:
          version: 'latest'

      - name: Restore R packages (if renv.lock exists)
        run: |
          if [ -f renv.lock ]; then
            Rscript -e "if (!requireNamespace('renv', quietly=TRUE)) install.packages('renv', repos='https://cloud.r-project.org'); renv::restore()"
          else
            echo "No renv.lock found — skipping package restore."
          fi

      - name: Render Quarto master
        run: quarto render 1_experiment/1_master.qmd

      - name: Upload rendered artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-master
          path: |
            1_experiment/Rendered_files/**
